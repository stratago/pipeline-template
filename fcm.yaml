spec_version: "1"
pipeline:
  name: Sambaqui
  author: stratago
  license: CC-BY-SA-4.0
  max_iterations: 5
ancora:
  territorio: Sambaqui
  declaracao: >-
    Bairro que leva no nome o samba, a ginga, o movimento entre compassos onde a alegria e tristeza
    caminham juntos no ritmo dos pés no caminhar de um povo que vive o mar e sol fazendo da pesca o
    seu alimento da alma e do corpo
agents:
  - id: letrista_b9xj7
    role: letrista
    kind: canonical
    model: claude-opus-4-8
    temperature: 0.7
    prompt_file: agents/letrista_b9xj7.md
    inputs:
      - ancora
    outputs:
      - letra
  - id: prosodista_e16pu
    role: prosodista
    kind: canonical
    model: claude-opus-4-8
    temperature: 0.7
    prompt_file: agents/prosodista_e16pu.md
    inputs:
      - letra
    outputs:
      - analise_prosodica
  - id: timbrista_9zoh0
    role: timbrista
    kind: canonical
    model: claude-opus-4-8
    temperature: 0.7
    prompt_file: agents/timbrista_9zoh0.md
    inputs:
      - estrutura
      - manifesto_audio
    outputs:
      - plano_timbre
  - id: arranjador_yvwll
    role: arranjador
    kind: canonical
    model: claude-opus-4-8
    temperature: 0.7
    prompt_file: agents/arranjador_yvwll.md
    inputs:
      - letra
      - analise_prosodica
    outputs:
      - estrutura
topology:
  entry: letrista_b9xj7
  exit: []
  edges:
    - from: letrista_b9xj7
      to: prosodista_e16pu
    - from: timbrista_9zoh0
      to: arranjador_yvwll
    - from: letrista_b9xj7
      to: timbrista_9zoh0
