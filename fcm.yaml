
spec_version: "1"
pipeline:
  name: "meu-pipeline"
  description: "Descreva a hipótese que este pipeline testa."
  author: "SEU_GITHUB_USERNAME"
  license: "CC-BY-SA-4.0"
  max_iterations: 3
ancora:
  territorio: "Ribeirão da Ilha, Florianópolis, SC"
  declaracao: |
    Substitua esta declaração pela sua âncora cultural real.
    Fale de onde vem, o que é vivo hoje, o que está em risco de desaparecer.
    Evite folclorização. Escreva como quem já morou ali.
  lexico_obrigatorio: []
  lexico_proibido: []
agents:
  - id: letrista
    role: letrista
    kind: canonical
    model: claude-opus-4-8
    prompt_file: agents/letrista.md
    inputs:  [ancora]
    outputs: [letra]
  - id: prosodista
    role: prosodista
    kind: canonical
    model: claude-sonnet-5
    prompt_file: agents/prosodista.md
    inputs:  [letra]
    outputs: [analise_prosodica]
  - id: critico
    role: critico_anticliche
    kind: canonical
    model: claude-opus-4-8
    prompt_file: agents/critico.md
    inputs:  [letra, ancora]
    outputs: [marcas_cliche]
  - id: arranjador_musical
    role: arranjador
    kind: canonical
    model: claude-sonnet-5
    prompt_file: agents/arranjador_musical.md
    inputs:  [letra, analise_prosodica, ancora]
    outputs: [partitura]
topology:
  entry: letrista
  exit: [arranjador_musical]
  edges:
    - { from: letrista,   to: prosodista }
    - { from: prosodista, to: critico }
    - { from: prosodista, to: arranjador_musical }
    - { from: critico,    to: letrista, kind: feedback, guard: "len(marcas_cliche) > 0" }
field_audio_manifest: field_audio/manifest.json
outputs_declared: [letra.md, analise_prosodica.md, plano_final.md, partitura.json]
